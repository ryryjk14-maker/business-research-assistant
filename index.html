<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Ledger</title>
</head>
<body>
<div id="ledger-root"></div>

<style>
  #ledger-root {
    --paper: #FAF8F2;
    --paper-dim: #F1EDE1;
    --ink: #23241F;
    --ink-soft: #55564C;
    --ink-faint: #8C8D80;
    --rule: #9B2C2C;
    --rule-dim: #C98F8F;
    --brass: #8A6D1F;
    --brass-bg: #EFE6C9;
    --line: #D8D3C1;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;

    display: block;
    width: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    border-radius: 4px;
    border: 1px solid var(--line);
    overflow: hidden;
  }

  #ledger-root * { box-sizing: border-box; }

  .lg-header {
    padding: 20px 24px 16px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .lg-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.2px;
    margin: 0;
  }
  .lg-subtitle {
    font-size: 12px;
    color: var(--ink-faint);
    font-family: var(--mono);
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .lg-body {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 460px;
  }
  @media (max-width: 640px) {
    .lg-body { grid-template-columns: 1fr; }
    .lg-log { border-right: none; border-bottom: 1px solid var(--line); max-height: 220px; }
  }

  .lg-log {
    border-right: 1px solid var(--line);
    background: var(--paper-dim);
    padding: 14px 0;
    overflow-y: auto;
    max-height: 620px;
  }
  .lg-log-heading {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 0 16px 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }
  .lg-log-empty {
    padding: 16px;
    font-size: 12px;
    color: var(--ink-faint);
    font-style: italic;
    line-height: 1.5;
  }
  .lg-log-item {

    padding: 10px 16px;
